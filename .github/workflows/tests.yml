name: Tests
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true
jobs:
  regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements*.txt
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg openssl
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements-dev.txt
      - name: Complete Python suite including HTTPS/OpenSSL fixtures
        run: python -m pytest tests -q
      - name: All Node unit tests
        shell: bash
        run: |
          mapfile -d '' unit_tests < <(find tests -type f -name '*.test.cjs' -not -path '*/node_modules/*' -print0)
          test "${#unit_tests[@]}" -gt 0
          node --test --test-isolation=none "${unit_tests[@]}"
      - name: Recursive JavaScript syntax
        shell: bash
        run: |
          while IFS= read -r -d '' file; do
            node --check "$file"
          done < <(find static scripts tests -type f \( -name '*.js' -o -name '*.cjs' -o -name '*.mjs' \) -not -path '*/node_modules/*' -print0)
      - name: HTTPS bootstrap shell syntax
        run: bash -n scripts/https/install.sh
      - name: Pinned HEVC vendor integrity
        run: node scripts/check-hevc-assets.cjs

  browser-functional:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      CI: 'true'
      WVW_PYTHON: python
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements*.txt
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: tests/browser/package-lock.json
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: python -m pip install -r requirements-dev.txt
      - name: Install pinned browser test dependencies
        working-directory: tests/browser
        run: npm ci --ignore-scripts --registry=https://registry.npmjs.org/
      - name: Install matching Chromium and operating-system dependencies
        working-directory: tests/browser
        run: npx --no-install playwright install --with-deps chromium
      - name: Synthetic functional browser suite (visual updates excluded)
        working-directory: tests/browser
        run: npm test
      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: browser-functional-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            tests/browser/playwright-report/
            tests/browser/test-results/
          if-no-files-found: warn
          retention-days: 14

  browser-visual-review:
    needs: [regression, browser-functional]
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      CI: 'true'
      WVW_PYTHON: python
      PYTHONIOENCODING: utf-8
      WVW_VISUAL_CANDIDATES: ${{ (github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[visual review]')) && startsWith(github.ref_name, 'release-') }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: tests/browser/package-lock.json
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: python -m pip install -r requirements-dev.txt
      - working-directory: tests/browser
        run: npm ci --ignore-scripts --registry=https://registry.npmjs.org/
      - working-directory: tests/browser
        run: npx --no-install playwright install --with-deps chromium
      - name: Compare reviewed images; candidate generation requires an explicit request
        working-directory: tests/browser
        shell: bash
        run: |
          if python -c "from pathlib import Path; raise SystemExit(not any(Path('snapshots').rglob('*.png')))"; then
            npm run test:visual
          else
            if [ "$WVW_VISUAL_CANDIDATES" != 'true' ]; then
              echo 'Reviewed screenshots are missing. Automatic CI cannot generate or accept them.' >&2
              exit 1
            fi
            npm run visual:update
            echo 'Candidate images generated. Visual review and a separate commit are required before comparison.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload visual comparison or unapproved candidate evidence
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: visual-review-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            tests/browser/snapshots/
            tests/browser/playwright-report/
            tests/browser/test-results/
          if-no-files-found: warn
          retention-days: 14
